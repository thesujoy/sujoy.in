<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, follow">

    <meta name="theme-color" content="#03050d">

    <meta name="color-scheme" content="dark">

    <title>Lost? | Sujoy</title>

    <link rel="icon"
          href="/favicon.ico"
          sizes="any">

    <link rel="apple-touch-icon"
          href="/apple-touch-icon.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
          rel="stylesheet">


    <style>

        :root {
            --bg: #03050d;
            --text: #f5f7ff;
            --muted: #9ca9c5;
            --accent: #8878ff;
            --accent-2: #5edcff;
            --line: rgba(255,255,255,.08);
            --max-width: 1180px;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {
            min-height: 100vh;
            min-height: 100dvh;

            color: var(--text);
            background: var(--bg);

            font-family: "IBM Plex Sans", sans-serif;

            -webkit-font-smoothing: antialiased;

            overflow-x: hidden;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            position: relative;

            min-height: 100vh;
            min-height: 100dvh;

            display: grid;

            grid-template-rows:
                auto
                minmax(0, 1fr)
                auto;

            overflow: hidden;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .space {
            position: fixed;
            inset: 0;

            z-index: -10;

            overflow: hidden;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(100,93,255,.14),
                    transparent 42%
                ),

                radial-gradient(
                    circle at 90% 72%,
                    rgba(55,185,255,.08),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 10% 78%,
                    rgba(151,74,255,.06),
                    transparent 34%
                ),

                #03050d;
        }


        /* =====================================================
           STARS
        ===================================================== */

        .stars {
            position: absolute;

            inset: -220px;

            background-repeat: repeat;

            pointer-events: none;
        }


        .stars-1 {
            opacity: .42;

            background-image:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.8) 1px,
                    transparent 1.3px
                );

            background-size: 90px 90px;

            animation:
                starsOne 65s linear infinite;
        }


        .stars-2 {
            opacity: .32;

            background-image:
                radial-gradient(
                    circle,
                    rgba(130,210,255,.9) 1.2px,
                    transparent 1.6px
                );

            background-size: 170px 150px;

            animation:
                starsTwo 48s linear infinite;
        }


        .stars-3 {
            opacity: .20;

            background-image:
                radial-gradient(
                    circle,
                    rgba(196,165,255,1) 1.6px,
                    transparent 2px
                );

            background-size: 290px 250px;

            animation:
                starsThree 38s linear infinite;
        }


        @keyframes starsOne {

            from {
                transform: translate3d(0,0,0);
            }

            to {
                transform: translate3d(0,-180px,0);
            }

        }


        @keyframes starsTwo {

            from {
                transform: translate3d(0,0,0);
            }

            to {
                transform: translate3d(-120px,-250px,0);
            }

        }


        @keyframes starsThree {

            from {
                transform: translate3d(0,0,0);
            }

            to {
                transform: translate3d(150px,-300px,0);
            }

        }


        /* =====================================================
           NEBULAS
        ===================================================== */

        .nebula {
            position: absolute;

            border-radius: 50%;

            filter: blur(90px);

            pointer-events: none;
        }


        .nebula-1 {
            width: 520px;
            height: 520px;

            left: -230px;
            top: 5%;

            opacity: .15;

            background: #6553ff;

            animation:
                nebulaOne 15s ease-in-out infinite alternate;
        }


        .nebula-2 {
            width: 470px;
            height: 470px;

            right: -200px;
            bottom: -120px;

            opacity: .12;

            background: #29b6e8;

            animation:
                nebulaTwo 19s ease-in-out infinite alternate;
        }


        .nebula-3 {
            width: 380px;
            height: 380px;

            left: 45%;
            top: 30%;

            opacity: .07;

            background: #a653ff;

            animation:
                nebulaThree 22s ease-in-out infinite alternate;
        }


        @keyframes nebulaOne {

            to {
                transform:
                    translate(80px,50px)
                    scale(1.12);
            }

        }


        @keyframes nebulaTwo {

            to {
                transform:
                    translate(-80px,-50px)
                    scale(1.15);
            }

        }


        @keyframes nebulaThree {

            to {
                transform:
                    translate(40px,-50px)
                    scale(1.18);
            }

        }


        /* =====================================================
           SHOOTING STAR
        ===================================================== */

        .shooting-star {
            position: absolute;

            width: 140px;
            height: 1px;

            top: 17%;
            left: 82%;

            opacity: 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.9),
                    transparent
                );

            filter:
                drop-shadow(
                    0 0 5px rgba(96,220,255,.8)
                );

            transform: rotate(-35deg);

            animation:
                shooting 9s ease-in-out infinite;
        }


        @keyframes shooting {

            0%,
            72% {
                opacity: 0;

                transform:
                    translate3d(0,0,0)
                    rotate(-35deg);
            }

            76% {
                opacity: .85;
            }

            86% {
                opacity: 0;

                transform:
                    translate3d(-400px,280px,0)
                    rotate(-35deg);
            }

            100% {
                opacity: 0;
            }

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            position: relative;

            z-index: 20;

            min-height: 78px;

            display: flex;
            align-items: center;
        }


        .header-inner {
            width:
                min(
                    calc(100% - 40px),
                    var(--max-width)
                );

            margin-inline: auto;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            display: inline-flex;

            align-items: center;

            gap: 10px;

            font-family: "Space Grotesk", sans-serif;

            font-size: 1.4rem;

            font-weight: 700;

            letter-spacing: -.04em;
        }


        .logo-mark {
            position: relative;

            width: 34px;
            height: 34px;

            flex-shrink: 0;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #d8f7ff 0%,
                    #6bdcff 20%,
                    #7667ff 55%,
                    #3b237d 100%
                );

            box-shadow:
                0 0 15px rgba(95,225,255,.30),
                0 0 32px rgba(139,124,255,.22);

            animation:
                logoPulse 4s ease-in-out infinite;
        }


        .logo-mark::before {
            content: "";

            position: absolute;

            width: 45px;
            height: 13px;

            left: 50%;
            top: 50%;

            border:
                1.5px solid rgba(255,255,255,.75);

            border-radius: 50%;

            transform:
                translate(-50%,-50%)
                rotate(-25deg);

            animation:
                logoOrbit 7s linear infinite;
        }


        .logo-mark::after {
            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            left: 5px;
            top: 5px;

            border-radius: 50%;

            background: #fff;

            box-shadow:
                0 0 8px #fff,
                0 0 14px #73dcff;
        }


        .logo-text {
            background:
                linear-gradient(
                    100deg,
                    #fff 10%,
                    #aedfff 45%,
                    #b4a6ff 70%,
                    #fff 100%
                );

            background-size: 200% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                logoText 5s linear infinite;
        }


        @keyframes logoOrbit {

            from {
                transform:
                    translate(-50%,-50%)
                    rotate(-25deg);
            }

            to {
                transform:
                    translate(-50%,-50%)
                    rotate(335deg);
            }

        }


        @keyframes logoPulse {

            0%,
            100% {
                box-shadow:
                    0 0 14px rgba(95,225,255,.28),
                    0 0 28px rgba(139,124,255,.18);
            }

            50% {
                box-shadow:
                    0 0 22px rgba(95,225,255,.50),
                    0 0 45px rgba(139,124,255,.30);
            }

        }


        @keyframes logoText {

            from {
                background-position: 200% center;
            }

            to {
                background-position: -200% center;
            }

        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {
            position: relative;

            z-index: 5;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                35px
                24px
                45px;
        }


        .content {
            width: 100%;

            max-width: 680px;

            margin-inline: auto;

            text-align: center;
        }


        /* =====================================================
           IMAGE
        ===================================================== */

        .image-wrap {
            position: relative;

            width: 156px;
            height: 156px;

            margin:
                0 auto
                30px;

            border-radius: 50%;

            padding: 4px;

            background:
                linear-gradient(
                    135deg,
                    rgba(108,219,255,.95),
                    rgba(127,96,255,.95),
                    rgba(199,111,255,.8)
                );

            box-shadow:
                0 0 30px rgba(95,225,255,.14),
                0 0 55px rgba(139,124,255,.16);

            opacity: 0;

            transform:
                translateY(18px)
                scale(.92);

            animation:
                appear .8s ease .08s forwards,
                imageFloat 5s ease-in-out 1s infinite;
        }


        .image-wrap::before {
            content: "";

            position: absolute;

            inset: -12px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 50%;

            animation:
                imageRing 10s linear infinite;
        }


        .image-wrap::after {
            content: "";

            position: absolute;

            width: 7px;
            height: 7px;

            top: 4px;
            right: 19px;

            border-radius: 50%;

            background: #fff;

            box-shadow:
                0 0 8px #fff,
                0 0 15px #65ddff;
        }


        .profile-image {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            border: 3px solid #060915;

            background: #0a0e1c;
        }


        @keyframes imageFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }


        @keyframes imageRing {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           HEADING
        ===================================================== */

        h1 {
            font-family:
                "Space Grotesk",
                sans-serif;

            font-size:
                clamp(
                    2.1rem,
                    5vw,
                    3.3rem
                );

            font-weight: 600;

            line-height: 1.1;

            letter-spacing: -.045em;

            margin-bottom: 16px;

            background:
                linear-gradient(
                    115deg,
                    #ffffff 10%,
                    #aeeaff 42%,
                    #9b8cff 70%,
                    #e2c8ff 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            opacity: 0;

            transform: translateY(16px);

            animation:
                appear .8s ease .22s forwards;
        }


        .description {
            max-width: 500px;

            margin-inline: auto;

            color: var(--muted);

            font-size: .98rem;

            line-height: 1.7;

            opacity: 0;

            transform: translateY(16px);

            animation:
                appear .8s ease .34s forwards;
        }


        /* =====================================================
           REDIRECT TEXT
        ===================================================== */

        .redirect {
            margin-top: 26px;

            color: #707d99;

            font-size: .8rem;

            opacity: 0;

            transform: translateY(16px);

            animation:
                appear .8s ease .46s forwards;
        }


        .redirect strong {
            color: #c1cbe0;

            font-weight: 600;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            position: relative;

            z-index: 10;

            width:
                min(
                    calc(100% - 40px),
                    var(--max-width)
                );

            margin-inline: auto;

            padding:
                20px
                0
                24px;

            border-top:
                1px solid
                var(--line);

            text-align: center;

            color: #5f6a83;

            font-size: .75rem;
        }


        /* =====================================================
           ANIMATION
        ===================================================== */

        @keyframes appear {

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =====================================================
           SHORT DESKTOP HEIGHT
        ===================================================== */

        @media
        (min-width: 700px)
        and
        (max-height: 760px) {

            header {
                min-height: 68px;
            }


            main {
                padding:
                    15px
                    24px
                    25px;
            }


            .image-wrap {
                width: 120px;
                height: 120px;

                margin-bottom: 20px;
            }


            h1 {
                font-size:
                    clamp(
                        1.9rem,
                        4vw,
                        2.7rem
                    );

                margin-bottom: 12px;
            }


            .description {
                font-size: .92rem;

                line-height: 1.55;
            }


            .redirect {
                margin-top: 18px;
            }


            footer {
                padding:
                    14px
                    0
                    16px;
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            header {
                min-height: 70px;
            }


            .header-inner {
                width:
                    calc(100% - 30px);
            }


            .logo {
                font-size: 1.25rem;
            }


            .logo-mark {
                width: 31px;
                height: 31px;
            }


            main {
                padding:
                    25px
                    20px
                    35px;
            }


            .image-wrap {
                width: 130px;
                height: 130px;

                margin-bottom: 24px;
            }


            h1 {
                font-size:
                    clamp(
                        2rem,
                        10vw,
                        2.65rem
                    );
            }


            .description {
                font-size: .92rem;

                line-height: 1.65;
            }


            footer {
                width:
                    calc(100% - 30px);

                padding:
                    17px
                    0
                    20px;
            }

        }


        /* =====================================================
           VERY SHORT MOBILE
        ===================================================== */

        @media
        (max-width: 600px)
        and
        (max-height: 650px) {

            header {
                min-height: 62px;
            }


            main {
                padding:
                    10px
                    18px
                    20px;
            }


            .image-wrap {
                width: 92px;
                height: 92px;

                margin-bottom: 15px;
            }


            h1 {
                font-size: 1.75rem;

                margin-bottom: 9px;
            }


            .description {
                font-size: .84rem;

                line-height: 1.5;
            }


            .redirect {
                margin-top: 13px;

                font-size: .72rem;
            }


            footer {
                padding:
                    10px
                    0
                    12px;
            }

        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
            }

        }

    </style>

</head>


<body>

<div class="page">


    <!-- =====================================================
         BACKGROUND
    ===================================================== -->

    <div class="space">

        <div class="stars stars-1"></div>
        <div class="stars stars-2"></div>
        <div class="stars stars-3"></div>

        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="nebula nebula-3"></div>

        <div class="shooting-star"></div>

    </div>



    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>

        <div class="header-inner">

            <a
                href="/"
                class="logo"
                aria-label="Sujoy Home"
            >

                <span class="logo-mark"></span>

                <span class="logo-text">
                    Sujoy
                </span>

            </a>

        </div>

    </header>



    <!-- =====================================================
         CONTENT
    ===================================================== -->

    <main>

        <div class="content">


            <!--
                Replace /lost-image.jpg
                with your actual image path.
            -->

            <div class="image-wrap">

                <img
                    src="babe.jpg"
                    alt="Babe"
                    class="profile-image"
                >

            </div>


            <h1>
                Are you lost, baby girl?
            </h1>


            <p class="description">

                Looks like you've wandered a little too far
                into the universe. Don't worry — you'll be
                sent back to familiar space soon.

            </p>


            <p class="redirect">

                Returning to the Home 🏡 in

                <strong>
                    <span id="countdown">10</span>s
                </strong>

            </p>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer>

        © <span id="year"></span> Sujoy.
        All rights reserved.

    </footer>


</div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

    /* Current year */

    document
        .getElementById("year")
        .textContent =
        new Date().getFullYear();



    /* =====================================================
       10 SECOND REDIRECT
    ===================================================== */

    let seconds = 10;

    const countdown =
        document.getElementById("countdown");


    const timer =
        setInterval(() => {

            seconds--;

            countdown.textContent =
                seconds;


            if (seconds <= 0) {

                clearInterval(timer);

                window.location.replace("/");

            }

        }, 1000);

</script>


</body>
</html>
