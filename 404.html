<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="10;url=/">
<title>404 • Page Not Found</title>

<style>
:root{
    --bg:#0f172a;
    --card:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.08);
    --text:#f8fafc;
    --muted:#94a3b8;
    --primary:#3b82f6;
    --primary2:#8b5cf6;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:
        radial-gradient(circle at top left,#2563eb33,transparent 40%),
        radial-gradient(circle at bottom right,#9333ea33,transparent 35%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    padding:24px;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:linear-gradient(to bottom,black,transparent);
    pointer-events:none;
}

.card{
    width:100%;
    max-width:680px;
    text-align:center;
    padding:60px 45px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:28px;
    backdrop-filter:blur(18px);
    box-shadow:0 20px 80px rgba(0,0,0,.35);
}

.badge{
    display:inline-block;
    padding:8px 18px;
    border-radius:999px;
    background:rgba(59,130,246,.12);
    border:1px solid rgba(59,130,246,.25);
    color:#93c5fd;
    font-size:.85rem;
    margin-bottom:24px;
}

.code{
    font-size:7rem;
    font-weight:800;
    letter-spacing:-4px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:12px;
}

h1{
    font-size:2rem;
    margin-bottom:16px;
}

p{
    color:var(--muted);
    font-size:1.05rem;
    line-height:1.8;
    max-width:500px;
    margin:0 auto 40px;
}

.actions{
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 26px;
    border-radius:14px;
    text-decoration:none;
    font-weight:600;
    transition:.25s ease;
}

.primary{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;
}

.primary:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(59,130,246,.35);
}

.secondary{
    color:var(--text);
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
}

.secondary:hover{
    background:rgba(255,255,255,.08);
}

.footer{
    margin-top:36px;
    color:#64748b;
    font-size:.9rem;
}

@media (max-width:640px){

    .card{
        padding:45px 28px;
    }

    .code{
        font-size:5rem;
    }

    h1{
        font-size:1.6rem;
    }

    p{
        font-size:1rem;
    }

    .actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}
</style>
</head>
<body>

<div class="card">

    <div class="badge">Error 404</div>

    <div class="code">404</div>

    <h1>Oops! This page doesn't exist.</h1>

    <p>
        The page you're looking for may have been moved, deleted,
        or the URL might be incorrect.
    </p>

    <div class="actions">
        <a href="/" class="btn primary">🏠 Back to Home</a>
        <a href="javascript:history.back()" class="btn secondary">← Go Back</a>
    </div>

    <div class="footer">
        If you believe this is an error, please contact the site administrator.
    </div>

</div>

<script>
setTimeout(() => {
    window.location.href = "/";
}, 10000);
</script>

</body>
</html>
